<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Daily Recitation screenshot placeholder</title>
  <desc id="desc">A placeholder card where a screenshot of the Today view should go.</desc>

  <rect width="1200" height="760" fill="#edf0f8"/>
  <circle cx="1080" cy="90" r="150" fill="#f4d6c8" opacity="0.55"/>
  <circle cx="130" cy="690" r="170" fill="#dfe4f2" opacity="0.8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="100" y="112" fill="#b1123b" font-size="15" font-weight="700" letter-spacing="2.4">DAILY RECITATION</text>
    <text x="100" y="174" fill="#10162c" font-size="44" font-weight="700">Screenshot placeholder</text>
    <text x="100" y="210" fill="#626b80" font-size="20">Replace this image with a screenshot of the Today view.</text>

    <rect x="100" y="252" width="1000" height="396" rx="32" fill="#ffffff" stroke="#b9c2d8" stroke-width="2" stroke-dasharray="10 10"/>
    <rect x="100" y="252" width="1000" height="396" rx="32" fill="none" stroke="#ffffff" stroke-width="1"/>

    <g transform="translate(566 320)">
      <rect x="0" y="0" width="68" height="68" rx="20" fill="#11182f"/>
      <path d="M18 18h14.5c2.8 0 5 2.2 5 5v29c0-2.8-2.2-5-5-5H18zm32 0h-4.5c-2.8 0-5 2.2-5 5v29c0-2.8 2.2-5 5-5H50z" fill="#e8a17f"/>
    </g>

    <text x="600" y="444" text-anchor="middle" fill="#10162c" font-size="30" font-weight="700">Add a screenshot here</text>
    <text x="600" y="482" text-anchor="middle" fill="#626b80" font-size="19">Capture the Today view after replacing real names with placeholders.</text>

    <rect x="452" y="516" width="296" height="50" rx="25" fill="#f7f0eb"/>
    <circle cx="482" cy="541" r="6" fill="#b1123b"/>
    <text x="500" y="547" fill="#4f5872" font-size="17" font-weight="600">screenshot.svg</text>
    <text x="600" y="596" text-anchor="middle" fill="#8a92a6" font-size="15">Public demo data only — no real student information.</text>

    <g transform="translate(100 684)">
      <circle cx="8" cy="8" r="8" fill="#b1123b"/>
      <text x="26" y="14" fill="#4f5872" font-size="15">Done</text>
      <circle cx="98" cy="8" r="8" fill="#e8a17f"/>
      <text x="116" y="14" fill="#4f5872" font-size="15">In progress</text>
      <circle cx="230" cy="8" r="8" fill="#d7dceb"/>
      <text x="248" y="14" fill="#4f5872" font-size="15">Not yet</text>
    </g>
  </g>
</svg>
